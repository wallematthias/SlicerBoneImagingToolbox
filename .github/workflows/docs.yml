name: Docs

on:
  pull_request:
    paths:
      - ".readthedocs.yaml"
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - ".readthedocs.yaml"
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build docs
        run: mkdocs build --strict
